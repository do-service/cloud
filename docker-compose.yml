# Dev stack. `docker compose up -d postgres` is enough for backend work
# (`make run` in backend/, `npm run dev` in frontend/); `docker compose up`
# also builds and runs the app image itself, the way an admin would run it.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloud}
      POSTGRES_DB: ${POSTGRES_DB:-cloud}
      TZ: UTC
      PGTZ: UTC
    # 55433, not 5432/55432: chat's dev postgres already holds 55432 on the
    # same machine. Bound to 127.0.0.1 because of the weak default password.
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cloud:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cloud}:${POSTGRES_PASSWORD:-cloud}@postgres:5432/${POSTGRES_DB:-cloud}?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${CLOUD_PORT:-8090}}
      DATA_DIR: /data
      # First administrator, created on the first start only; once an admin
      # exists these are ignored.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Retention (0 = keep forever): trash 30 days, 50 versions per file.
      TRASH_RETENTION: ${TRASH_RETENTION:-720h}
      VERSIONS_MAX_COUNT: ${VERSIONS_MAX_COUNT:-50}
      VERSIONS_MAX_AGE: ${VERSIONS_MAX_AGE:-0}
      # Quota of new accounts (e.g. 10GiB; empty = unlimited) and how long
      # the audit log is kept (0 = forever).
      DEFAULT_QUOTA: ${DEFAULT_QUOTA:-}
      AUDIT_RETENTION: ${AUDIT_RETENTION:-8760h}
      # How long sync clients may stay offline before a full resync.
      SYNC_JOURNAL_RETENTION: ${SYNC_JOURNAL_RETENTION:-720h}
      # Reverse proxies in front (CIDRs, comma-separated) whose
      # X-Forwarded-For names the client: the audit log and rate limits
      # then see real addresses. Empty: none, the peer is the client.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Online editor (R12): the server reads OnlyOffice's discovery and
      # OnlyOffice calls back, both over the compose network. OnlyOffice
      # builds its editor URLs from the address it is asked at, so
      # WOPI_EDITOR_URL puts back the one the browser uses. Empty
      # WOPI_DISCOVERY_URL turns editing off. Collabora instead:
      #   WOPI_DISCOVERY_URL=http://collabora:9980/hosting/discovery \
      #   WOPI_EDITOR_URL= docker compose --profile collabora up -d
      WOPI_DISCOVERY_URL: ${WOPI_DISCOVERY_URL-http://onlyoffice/hosting/discovery}
      WOPI_HOST_URL: ${WOPI_HOST_URL:-http://cloud:8080}
      WOPI_EDITOR_URL: ${WOPI_EDITOR_URL-http://localhost:${ONLYOFFICE_PORT:-9981}}
    # Secrets and OIDC providers: SECRET_KEY (openssl rand -base64 32,
    # encrypts client secrets in the database), OIDC_PROVIDERS=slug,… and
    # OIDC_<SLUG>_ISSUER, _CLIENT_ID, _CLIENT_SECRET, _NAME, _SCOPES,
    # _AUTO_CREATE, _LINK_BY_EMAIL. Provider variables are named after the
    # slugs, so they come from this optional file. Don't add them to
    # `environment` above as well: an empty ${VAR:-} there overrides it.
    env_file:
      - path: ./cloud.env
        required: false
    # Host port 8090 by default: chat's dev backend already listens on 8080
    # on the same machine. Set CLOUD_PORT to change it.
    ports:
      - "127.0.0.1:${CLOUD_PORT:-8090}:8080"
    # The metrics port (9090) is deliberately not published: /metrics has
    # no auth and is meant for a scraper on the same docker network.
    volumes:
      - cloud_data:/data

  # OnlyOffice Docs Community (AGPL), the default online editor (E8-4).
  # The browser loads it from localhost:9981, its server reaches the WOPI
  # host as http://cloud:8080. Heavy: a ~3 GB image, ~0.8 GB of RAM idle
  # and more per open document (1.3 GB with one); after a (re)create it
  # regenerates fonts and restarts itself once (~1-2 min), dropping
  # documents opened meanwhile. Plain HTTP for
  # development; in production it sits behind the same TLS proxy as the
  # app.
  onlyoffice:
    image: onlyoffice/documentserver:10.0.0
    restart: unless-stopped
    environment:
      # WOPI is off by default: the image expects its own document API.
      WOPI_ENABLED: "true"
      # Its request filter refuses private addresses, and http://cloud:8080
      # on the compose network is one.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      # On top of that, WOPI calls go only to hosts a rule names (a "*"
      # rule doesn't count): the host of WOPI_HOST_URL.
      IP_FILTER_RULES: allow cloud
    ports:
      - "127.0.0.1:${ONLYOFFICE_PORT:-9981}:80"
    volumes:
      # The WOPI proof key is made on the first start and kept here:
      # without the volume every recreate signs with a new one.
      - onlyoffice_data:/var/www/onlyoffice/Data
      # Saves an open document back every 5 minutes while it changes, not
      # only once everyone closed it. Read after local.json, which the
      # image's start script rewrites; there's no env for it.
      - ./deploy/onlyoffice/local-production-linux.json:/etc/onlyoffice/documentserver/local-production-linux.json:ro

  # Collabora Online (MPL), the optional editor, off unless asked for:
  # `--profile collabora` and the cloud's WOPI_* switched to it (see
  # above). The browser loads it from localhost:9980 (server_name), its
  # server reaches the WOPI host as http://cloud:8080 (aliasgroup1).
  collabora:
    image: collabora/code:26.04.5.1.1
    profiles: [collabora]
    restart: unless-stopped
    depends_on:
      collabora-key:
        condition: service_completed_successfully
    environment:
      aliasgroup1: ${WOPI_HOST_URL:-http://cloud:8080}
      extra_params: >-
        --o:ssl.enable=false --o:ssl.termination=false
        --o:server_name=localhost:${COLLABORA_PORT:-9980}
        --o:net.frame_ancestors=localhost:${CLOUD_PORT:-8090}
      dictionaries: ru_RU en_US
    cap_add:
      - MKNOD
    ports:
      - "127.0.0.1:${COLLABORA_PORT:-9980}:9980"
    volumes:
      # The key it signs WOPI requests with (X-WOPI-Proof); without it
      # requests go unsigned and the host can't tell them from forgeries.
      - type: volume
        source: collabora_proof
        target: /etc/coolwsd/proof_key
        read_only: true
        volume:
          subpath: proof_key

  # Makes Collabora's proof key once, on the first start: its image has no
  # shell to do it in. The key stays in the volume, never in the repo.
  collabora-key:
    profiles: [collabora]
    build:
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk add --no-cache openssl
    command:
      - sh
      - -c
      - test -s /keys/proof_key || (openssl genrsa -traditional -out /keys/proof_key 2048 && chown 1001 /keys/proof_key && chmod 400 /keys/proof_key)
    volumes:
      - collabora_proof:/keys

  # Upload benchmark client (E3-9), off unless asked for: `make
  # bench-upload` in backend/, see bench/README.md. It shapes its own
  # egress to RATE and RTT, hence NET_ADMIN; SESSION (or BENCH_USER and
  # BENCH_PASSWORD) come from the caller's environment.
  bench-upload:
    build:
      context: .
      dockerfile: bench/upload/Dockerfile
    profiles: [bench]
    cap_add:
      - NET_ADMIN
    environment:
      RATE: ${RATE-1gbit}
      RTT: ${RTT:-0}
      SESSION: ${SESSION:-}
      BENCH_USER: ${BENCH_USER:-}
      BENCH_PASSWORD: ${BENCH_PASSWORD:-}

  # Background jobs run inside "cloud" (ROLE=all). To move them into a
  # process of their own, set ROLE=api on "cloud" and add:
  #   worker:
  #     build: { context: ., dockerfile: Dockerfile }
  #     restart: unless-stopped
  #     depends_on: { postgres: { condition: service_healthy } }
  #     environment:
  #       ROLE: worker
  #       DATABASE_URL: postgres://cloud:cloud@postgres:5432/cloud?sslmode=disable
  #       DATA_DIR: /data
  #     env_file: [{ path: ./cloud.env, required: false }]
  #     volumes: [cloud_data:/data]
  # A worker serves no public port; /healthz and /metrics are on 9090.

  # Development identity provider, off unless asked for:
  # `docker compose --profile e2e up -d keycloak`. Realm "cloud" (client
  # cloud / kc-client-secret, user ivan / ivanpass) is imported on start;
  # cloud.env then points at it with OIDC_KC_ISSUER=
  # http://keycloak:8180/realms/cloud. The same URL has to work from the
  # browser, which needs keycloak resolving to 127.0.0.1 (see CLAUDE.md).
  # `make test-e2e` in backend/ runs against it at localhost:8180.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    profiles: [e2e]
    command: ["start-dev", "--http-port=8180", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    # 8180 inside as well, so the issuer is the same URL for the app
    # container and the host. Loopback only: the admin password is weak.
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./deploy/keycloak/realm-cloud.json:/opt/keycloak/data/import/realm-cloud.json:ro

volumes:
  postgres_data:
  cloud_data:
  collabora_proof:
  onlyoffice_data:
