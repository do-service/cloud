# Quick start: the cloud from the published image, with PostgreSQL and
# OnlyOffice, ready to sign in. One file, nothing else to download:
#
#   curl -fsSLO https://raw.githubusercontent.com/do-service/cloud/main/deploy/quickstart/docker-compose.yml
#   docker compose up -d
#   docker compose logs init        # the administrator's password
#
# Then open http://localhost:8080 and sign in as "admin". The secrets are
# generated on the first start and kept in the "secrets" volume; the
# password only matters until the first sign-in — change it in the admin
# page. Plain HTTP on localhost: for a server, put a TLS proxy in front and
# set PUBLIC_URL / OFFICE_URL to the addresses the browser uses.
#
# Settings (environment or a .env file next to this one):
#   PUBLIC_URL    the cloud as the browser opens it   (http://localhost:8080)
#   OFFICE_URL    OnlyOffice as the browser opens it  (http://localhost:8081)
#   CLOUD_PORT, OFFICE_PORT   host ports              (8080, 8081)
#   BIND          host address the ports listen on    (127.0.0.1; 0.0.0.0
#                 for every interface — only behind a firewall or a proxy)
#   CLOUD_IMAGE   the cloud's image                   (ghcr.io/do-service/cloud:edge)
#   POSTGRES_PASSWORD                                 (generated: see init)
# Everything else the server reads (quotas, retention, OIDC providers…) is
# in the main docker-compose.yml and README.md; add it under cloud's
# environment.

services:
  # Makes the secrets once: the key that encrypts link tokens and OIDC
  # client secrets, the first administrator's password, the database
  # password. Later starts find them and only print the admin password
  # again.
  init:
    image: alpine:3.22
    restart: "no"
    command:
      - sh
      - -euc
      - |
        cd /secrets
        gen() { [ -s "$$1" ] || head -c "$$2" /dev/urandom | base64 | tr -d '\n/+=' | head -c "$$3" > "$$1"; }
        [ -s secret_key ] || head -c 32 /dev/urandom | base64 > secret_key
        gen admin_password 24 20
        gen postgres_password 32 32
        # The app runs as uid 10001 (Dockerfile). The database password is
        # read by postgres (uid 70) too, so it is world-readable — within
        # this volume, which only these services mount.
        chown 10001 secret_key admin_password && chmod 400 secret_key admin_password
        chmod 444 postgres_password
        echo "Sign in at ${PUBLIC_URL:-http://localhost:8080} as admin / $$(cat admin_password)"
    volumes:
      - secrets:/secrets

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: cloud
      POSTGRES_DB: cloud
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud"]
      interval: 5s
      timeout: 5s
      retries: 20

  cloud:
    image: ${CLOUD_IMAGE:-ghcr.io/do-service/cloud:edge}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # The server takes its secrets from the environment only: read them
    # from the volume, then become the server.
    entrypoint:
      - sh
      - -euc
      - |
        export SECRET_KEY="$$(cat /secrets/secret_key)"
        export ADMIN_PASSWORD="$$(cat /secrets/admin_password)"
        export DATABASE_URL="postgres://cloud:$$(cat /secrets/postgres_password)@postgres:5432/cloud?sslmode=disable"
        exec server
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Created on the first start only; ignored once an admin exists.
      ADMIN_USERNAME: admin
      # OnlyOffice: the server reads its discovery and OnlyOffice calls
      # back over this network; WOPI_EDITOR_URL is the address the browser
      # loads the editor from.
      WOPI_DISCOVERY_URL: http://onlyoffice/hosting/discovery
      WOPI_HOST_URL: http://cloud:8080
      WOPI_EDITOR_URL: ${OFFICE_URL:-http://localhost:8081}
      LOG_FORMAT: text
    ports:
      - "${BIND:-127.0.0.1}:${CLOUD_PORT:-8080}:8080"
    volumes:
      - cloud_data:/data
      - secrets:/secrets:ro

  # OnlyOffice Docs Community (AGPL), the online editor. Heavy: a ~3 GB
  # image and ~1 GB of RAM; after the first start it builds its fonts for
  # a minute or two, and documents open only after that. To run without
  # it, delete this service and set WOPI_DISCOVERY_URL to "" above.
  onlyoffice:
    image: onlyoffice/documentserver:10.0.0
    restart: unless-stopped
    environment:
      WOPI_ENABLED: "true"
      # It refuses private addresses, and http://cloud:8080 is one; WOPI
      # calls also go only to hosts a rule names.
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      IP_FILTER_RULES: allow cloud
    configs:
      # Saves an open document every 5 minutes while it changes, not only
      # once everyone has closed it.
      - source: onlyoffice_autosave
        target: /etc/onlyoffice/documentserver/local-production-linux.json
    ports:
      - "${BIND:-127.0.0.1}:${OFFICE_PORT:-8081}:80"
    volumes:
      # Its WOPI signing key lives here: without the volume every
      # recreate would sign with a new one.
      - onlyoffice_data:/var/www/onlyoffice/Data

configs:
  onlyoffice_autosave:
    content: |
      {"services": {"CoAuthoring": {"autoAssembly": {"enable": true, "interval": "5m", "step": "1m"}}}}

volumes:
  secrets:
  postgres_data:
  cloud_data:
  onlyoffice_data:
